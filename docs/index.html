<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaptec Laddningsstatistik</title>
    <!-- Tailwind CSS för snygg design -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js för grafer -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <header class="mb-8 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
            <div>
                <h1 class="text-3xl font-bold tracking-tight text-gray-900">Zaptec Laddningsstatistik</h1>
                <p class="text-sm text-gray-500 mt-1">Översikt över förbrukning, dynamiska grafer och faktiska elkostnader.</p>
            </div>
            <div id="last-updated" class="text-xs text-gray-400 bg-white px-3 py-2 rounded-lg border shadow-sm">
                Laddar data...
            </div>
        </header>

        <!-- KPI-kort -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-sm font-medium text-gray-500">Total förbrukning</p>
                <p id="kpi-kwh" class="text-3xl font-bold text-gray-900 mt-2">0 kWh</p>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-sm font-medium text-gray-500">Total kostnad (faktiskt pris)</p>
                <p id="kpi-cost" class="text-3xl font-bold text-gray-900 mt-2">0 kr</p>
            </div>
            <div class="bg-white p-6 rounded-xl border shadow-sm">
                <p class="text-sm font-medium text-gray-500">Antal sessioner</p>
                <p id="kpi-sessions" class="text-3xl font-bold text-gray-900 mt-2">0 st</p>
            </div>
        </div>

        <!-- Layout med grafer och filter/användarlista -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-8">
            <!-- Stapeldiagram med toggle (tar 2 kolumner) -->
            <div class="bg-white p-6 rounded-xl border shadow-sm lg:col-span-2 flex flex-col justify-between">
                <div>
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-4">
                        <h3 id="chart-title" class="text-sm font-semibold text-gray-700 uppercase tracking-wider">Månadsvis förbrukning (kWh)</h3>
                        <!-- Toggle-knapp -->
                        <div class="inline-flex rounded-lg bg-gray-100 p-1 border">
                            <button id="btn-kwh" onclick="setChartMetric('kwh')" class="px-3 py-1.5 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition">kWh</button>
                            <button id="btn-kr" onclick="setChartMetric('kr')" class="px-3 py-1.5 text-xs font-semibold rounded-md text-gray-600 hover:text-gray-900 transition">kr</button>
                        </div>
                    </div>
                    <div class="relative h-64">
                        <canvas id="monthlyChart"></canvas>
                    </div>
                </div>
            </div>

            <!-- Användarchecklista & Månadsfilter (tar 1 kolumn) -->
            <div class="bg-white p-6 rounded-xl border shadow-sm flex flex-col justify-between">
                <div>
                    <div class="mb-4">
                        <label class="block text-xs font-semibold text-gray-500 uppercase mb-1">Filtrera månad</label>
                        <select id="filter-month" class="w-full bg-gray-50 border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
                            <option value="all">Alla månader</option>
                        </select>
                    </div>

                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-1">
                            <label class="block text-xs font-semibold text-gray-500 uppercase">Inkludera användare</label>
                            <div class="space-x-2">
                                <button onclick="toggleAllUsers(true)" class="text-[10px] text-blue-600 hover:underline">Alla</button>
                                <span class="text-gray-300">|</span>
                                <button onclick="toggleAllUsers(false)" class="text-[10px] text-blue-600 hover:underline">Inga</button>
                            </div>
                        </div>
                        <!-- Checklista fylls på dynamiskt -->
                        <div id="user-checkboxes" class="space-y-2 max-h-40 overflow-y-auto pr-1 border bg-gray-50 p-2 rounded-lg text-sm">
                            <!-- JS fyller i här -->
                        </div>
                    </div>
                </div>

                <button id="reset-filters" class="w-full text-sm text-gray-600 bg-gray-100 hover:bg-gray-200 px-4 py-2 rounded-lg transition mt-2">Rensa filter</button>
            </div>
        </div>

        <!-- Tabell -->
        <div class="bg-white rounded-xl border shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold text-gray-500 uppercase tracking-wider">
                            <th class="px-6 py-3">Datum / Tid</th>
                            <th class="px-6 py-3">Användare</th>
                            <th class="px-6 py-3 text-right">Förbrukning (kWh)</th>
                            <th class="px-6 py-3 text-right">Kostnad (kr)</th>
                        </tr>
                    </thead>
                    <tbody id="table-body" class="divide-y divide-gray-200 text-sm">
                        <!-- Fylls på via JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let allData = [];
        let allUsers = [];
        let selectedMetric = 'kwh'; // 'kwh' eller 'kr'
        let monthlyChartInstance = null;

        async function loadData() {
            try {
                const response = await fetch('data.json');
                if (!response.ok) throw new Error('Kunde inte ladda data.json');
                const json = await response.json();
                allData = json.sessions || [];
                
                document.getElementById('last-updated').innerText = `Uppdaterad: ${json.updated_at || 'Okänt'}`;
                
                // Hämta unika användare och välj alla som standard
                allUsers = [...new Set(allData.map(s => s.user))].sort();
                
                populateMonths();
                populateUserCheckboxes();
                render();
            } catch (err) {
                document.getElementById('table-body').innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-red-500">Kunde inte hitta data.json. Kör GitHub Action först!</td></tr>`;
            }
        }

        function populateMonths() {
            const months = [...new Set(allData.map(s => s.date.substring(0, 7)))].sort().reverse();
            const monthSelect = document.getElementById('filter-month');
            months.forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                monthSelect.appendChild(opt);
            });
        }

        function populateUserCheckboxes() {
            const container = document.getElementById('user-checkboxes');
            container.innerHTML = '';
            allUsers.forEach(u => {
                const label = document.createElement('label');
                label.className = "flex items-center space-x-2 text-xs text-gray-700 cursor-pointer py-0.5";
                label.innerHTML = `
                    <input type="checkbox" value="${u}" checked onchange="render()" class="user-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500 h-4 w-4">
                    <span class="truncate" title="${u}">${u}</span>
                `;
                container.appendChild(label);
            });
        }

        function toggleAllUsers(state) {
            document.querySelectorAll('.user-checkbox').forEach(cb => cb.checked = state);
            render();
        }

        function setChartMetric(metric) {
            selectedMetric = metric;
            const btnKwh = document.getElementById('btn-kwh');
            const btnKr = document.getElementById('btn-kr');
            const title = document.getElementById('chart-title');

            if (metric === 'kwh') {
                btnKwh.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition";
                btnKr.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-gray-600 hover:text-gray-900 transition";
                title.innerText = "Månadsvis förbrukning (kWh)";
            } else {
                btnKr.className = "px-3 py-1.5 text-xs font-semibold rounded-md bg-white text-blue-600 shadow-sm transition";
                btnKwh.className = "px-3 py-1.5 text-xs font-semibold rounded-md text-gray-600 hover:text-gray-900 transition";
                title.innerText = "Månadsvis kostnad (kr)";
            }
            renderChartOnly();
        }

        function getFilteredData() {
            const monthVal = document.getElementById('filter-month').value;
            const checkedUsers = Array.from(document.querySelectorAll('.user-checkbox:checked')).map(cb => cb.value);

            return allData.filter(s => {
                const matchMonth = (monthVal === 'all' || s.date.startsWith(monthVal));
                const matchUser = checkedUsers.includes(s.user);
                return matchMonth && matchUser;
            });
        }

        function render() {
            const filtered = getFilteredData();
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            let totalKwh = 0;
            let totalCost = 0;

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="px-6 py-8 text-center text-gray-400">Inga laddsessioner matchar valda filter.</td></tr>`;
            } else {
                filtered.forEach(s => {
                    const cost = s.cost || (s.energy * 1.50);
                    totalKwh += s.energy;
                    totalCost += cost;

                    const tr = document.createElement('tr');
                    tr.className = "hover:bg-gray-50 transition";
                    tr.innerHTML = `
                        <td class="px-6 py-4 text-gray-600">${s.date}</td>
                        <td class="px-6 py-4 font-medium text-gray-900">${s.user}</td>
                        <td class="px-6 py-4 text-right text-gray-700">${s.energy.toFixed(2)} kWh</td>
                        <td class="px-6 py-4 text-right font-semibold text-gray-900">${cost.toFixed(2)} kr</td>
                    `;
                    tbody.appendChild(tr);
                });
            }

            document.getElementById('kpi-kwh').innerText = `${totalKwh.toFixed(1)} kWh`;
            document.getElementById('kpi-cost').innerText = `${totalCost.toFixed(0)} kr`;
            document.getElementById('kpi-sessions').innerText = `${filtered.length} st`;

            renderChartOnly();
        }

        function renderChartOnly() {
            const filtered = getFilteredData();
            const monthlyData = {};

            filtered.forEach(s => {
                const month = s.date.substring(0, 7);
                const cost = s.cost || (s.energy * 1.50);
                
                if (selectedMetric === 'kwh') {
                    monthlyData[month] = (monthlyData[month] || 0) + s.energy;
                } else {
                    monthlyData[month] = (monthlyData[month] || 0) + cost;
                }
            });

            const sortedMonths = Object.keys(monthlyData).sort();
            const values = sortedMonths.map(m => monthlyData[m]);

            const ctx = document.getElementById('monthlyChart').getContext('2d');
            if (monthlyChartInstance) monthlyChartInstance.destroy();
            
            monthlyChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: sortedMonths,
                    datasets: [{
                        label: selectedMetric === 'kwh' ? 'kWh' : 'kr',
                        data: values,
                        backgroundColor: '#3b82f6',
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }

        document.getElementById('filter-month').addEventListener('change', render);
        document.getElementById('reset-filters').addEventListener('click', () => {
            document.getElementById('filter-month').value = 'all';
            toggleAllUsers(true);
        });

        loadData();
    </script>
</body>
</html>
